[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fingraph-eval"
version = "0.1.0"
description = "Eval harness for fingraph agents — compliance accuracy benchmarking"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fingraph_eval*"]
exclude = ["datasets*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["fingraph_eval/tests"]
