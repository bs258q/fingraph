[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fingraph-core"
version = "0.1.0"
description = "Financial entity relationship graph builder for KYC/AML/fraud"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "spacy>=3.7",
    "python-Levenshtein>=0.25",
    "feedparser>=6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "testcontainers[neo4j]>=4.0", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
