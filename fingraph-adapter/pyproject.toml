[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fingraph-adapter"
version = "0.1.0"
description = "OpenSanctions FtM to Neo4j adapter"
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["fingraph_adapter/tests"]
