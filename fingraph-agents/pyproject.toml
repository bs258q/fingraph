[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fingraph-agents"
version = "0.1.0"
description = "Claude API agents for FtM compliance graph workflows"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.30",
    "neo4j>=5.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["fingraph_agents/tests"]
